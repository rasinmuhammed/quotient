[project]
name = "quotient"
version = "0.1.0"
description = "RFQ to priced quote draft, with every number traced to a source row and a named rule."
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "groq>=0.30",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
tracing = [
    "langfuse>=4.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quotient"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
